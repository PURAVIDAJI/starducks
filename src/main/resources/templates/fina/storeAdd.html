<!DOCTYPE html>
<!--<meta charset="UTF-8">-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">

<!--<th:block layout:fragment="title">title</th:block>-->

<th:block layout:fragment="addMore">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">

    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

    <link rel="stylesheet" type="text/css" th:href="@{/css/hr/style.css}">
</th:block>

<main layout:fragment="content">
    <h3>Branch Registration</h3>
    <div class="row g-3 align-items-center">

        <div id="form" style="display: flex;">
            <div style="flex: 1;">
                <form id="addAlert" class="container" th:action="@{/fina/store/create}" method="post"
                      onsubmit="return confirmAdd()">
                    <dl>
                        <dt><label for="storeName" class="col-form-label">Branch Name</label></dt>
                        <dd><input type="text" id="storeName" name="storeName" placeholder="Branch Name" class="form-control">
                        </dd>
                    </dl>

                    <dl>
                        <dt><label for="businessNum">Business ID</label></dt>
                        <dd><input class="form-control" type="text" id="businessNum" name="businessNum"
                                   placeholder="Please enter numbers only"></dd>
                    </dl>

                    <dl>
                        <dt><label for="storeManager" class="col-form-label">Branch Manager</label></dt>
                        <dd><select id="storeManager" name="storeManager">
                            <option th:each="sm :${storeManager}"
                                    th:value="${sm}" th:text="${sm}"></option>
                        </select></dd>
                    </dl>

                    <dl>
                        <dt><label for="storeOpenDate" class="col-form-label">Opening Date</label></dt>
                        <dd><input type="date" id="storeOpenDate" name="storeOpenDate"></dd>
                    </dl>
                </form>
            </div>

            <div style="flex: 1;">
                <dl>
                    <dt><label for="addNo">Postal Code</label></dt>
                    <dd><input type="text" id="addNo" name="addNo" placeholder="우편번호"></dd>
                </dl>

                <!--                <dl>-->
                <!--                    <dt>주소</dt>-->
                <!--                    <dd>-->
                <!--                        <div th:replace="~{fina/store/_storeAddNo::searchPost}"></div>-->
                <!--                    </dd>-->
                <!--                </dl>-->
                <dl>
                    <dt><label for="storeAddr">Address Line 1</label></dt>
                    <dd><input type="text" id="storeAddr" name="storeAddr"></dd>
                </dl>

                <dl>
                    <dt><label for="storeDetailAddr">Address Line 2</label></dt>
                    <dd><input type="text" id="storeDetailAddr" name="storeDetailAddr" ></dd>
                </dl>

                <dl>
                    <dt><label for="storeOperationalYn">Operating Status</label></dt>
                    <dd><select id="storeOperationalYn" name="storeOperationalYn">
                        <option value="storeOperationalY">Open</option>
                        <option value="storeOperationalN">Closed</option>
                    </select></dd>
                </dl>
            </div>
        </div>
        <div style="display: flex; justify-content: center; align-items: center;">
            <button class="btn btn-primary" id="submitBtn" type="submit">Add</button>
            <button class="btn btn-secondary" type="button" onclick="location.href='/fina/store/list'">
                List
            </button>
        </div>
        </form>
    </div>

    <script>
        function confirmAdd(storeNo) {
            Swal.fire({
                title: 'Registration Confirmation',
                text: 'Do you want to register this information?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#3085d6',
                cancelButtonColor: '#d33',
                confirmButtonText: 'Confirm',
                cancelButtonText: 'Cancel'
            }).then((result) => {
                if (result.isConfirmed) {
                    document.getElementById('addAlert').submit();
                }
            })
            return false;
        }
    </script>
</main>
</html>
