<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div class="w-50 dept-table" id="info" th:fragment="info">
    <table>
        <tr>
            <th>Dept No.</th>
            <td th:text="${dept.deptId}"></td>
        </tr>
        <tr>
            <th>Dept Name</th>
            <td th:text="${dept.deptName}"></td>
        </tr>
        <tr>
            <th>Contact</th>
            <td th:text="${dept.deptRepTel}"></td>
        </tr>
        <tr>
            <th>Employee count</th>
            <td th:text="${dept.getRunningEmp()}"></td>
        </tr>
    </table>
    <button id="editBtn" class="commonBtn edit-button">Edit</button>
    <button th:onclick="'location.href=\'' + @{/hr/dept} + '\''" class="commonBtn cancel-button">List</button>
    <button th:onclick="|location.href='@{/hr/dept/delete/{deptId}(deptId=${dept.deptId})}'|" class="commonBtn delete-button">Delete</button>
</div>
