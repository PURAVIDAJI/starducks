<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">

<!--title-->
<title layout:fragment="title">사원정보</title>
<th:block layout:fragment="addMore">
    <link rel="stylesheet" type="text/css" th:href="@{/css/hr/style.css}">
    <script th:src="@{/js/hr/script.js}"></script>
</th:block>

<style>
    /* 상단의 페이지 제목 */
    .page-title {
        text-shadow: 0 1.5px 2px rgba(0, 0, 0, 0.25);
        color: #6B4D27;
    }
</style>

<main layout:fragment="content">
    <h1 class="page-title" style="margin-bottom: 50px;">| Employee Info</h1>
    <div id="form">
        <div class="photos">
            <div class="photo">
                <img th:src="${profile}" />
                <p>Profile</p>
            </div>
            <div class="photo">
                <img th:src="${stamp}" />
                <p>Stamp</p>
            </div>
        </div>
        <div id="formSection" th:object="${employee}">
            <section>
                <dl>
                    <dt>Employee ID</dt>
                    <dd><p th:text="*{empId}"></p></dd>
                </dl>
<!--                <dl>-->
<!--                    <dt>초기비밀번호</dt>-->
<!--                    <dd><p th:text="*{pwd}" style="overflow: hidden"></dd>-->
<!--                </dl>-->
                <dl>
                    <dt>Employee Name</dt>
                    <dd><p th:text="*{empName}"></dd>
                </dl>
                <dl>
                    <dt>Phone</dt>
                    <dd><p th:text="*{empTel}"></dd>
                </dl>
                <dl>
                    <dt>Email</dt>
                    <dd><p th:text="*{email}"></dd>
                </dl>
                <dl>
                    <dt>Gender</dt>
                    <dd><p th:text="*{gender}"></dd>
                </dl>
                <dl>
                    <dt>Date of Birth</dt>
                    <dd><p th:text="*{birth}"></dd>
                </dl>
            </section>
            <section>
                <dl>
                    <dt>Department</dt>
                    <dd><p th:text="*{dept.deptName}"></p></dd>
                </dl>

                <dl>
                    <dt>Position</dt>
                    <dd>
                        <p th:if="*{position.toString() == 'ROLE_EMPLOYEE'}">Associate</p>
                        <p th:if="*{position.toString() == 'ROLE_TEAMLEADER'}">Team Leader</p>
                        <p th:if="*{position.toString() == 'ROLE_DEPTLEADER'}">Department Head</p>
                        <p th:if="*{position.toString() == 'ROLE_BOSS'}">CEO</p>
                        <p th:if="*{position.toString() == 'ROLE_STOREMANAGER'}">Store Manager</p>
                    </dd>

                </dl>

                <dl>
                    <dt>Date of Joining</dt>
                    <dd><p th:text="*{joinDate}"></dd>
                </dl>

                <dl>
                    <dt>Resignation Status</dt>
                    <dd><p th:text="*{status}"></p></dd>
                </dl>

                <dl>
                    <dt>Date of Resignation</dt>
                    <dd>
                        <p th:if="*{leaveDate != null}" th:text="*{leaveDate}">
                        <p th:if="*{leaveDate == null}" th:text="|0000-00-00|">
                    </dd>
                </dl>
                <dl>
                    <dt>Postal Code</dt>
                    <dd><p th:text="*{postNo}"></dd>
                </dl>
                <dl>
                    <dt>Address Line 1</dt>
                    <dd><p th:text="*{addr}"> </dd>
                </dl>
                <dl>
                    <dt>Address Line 2</dt>
                    <dd><p th:text="*{dAddr}"> </dd>
                </dl>
            </section>
        </div>
        <div class="btns">
            <a th:href="@{edit/{id}(id=${empId})}"><button class="commonBtn edit-button">Edit</button></a>
            <a th:href="@{/hr/emp}"><button class="commonBtn cancel-button">List</button></a>
        </div>
    </div>
</main>
</html>
