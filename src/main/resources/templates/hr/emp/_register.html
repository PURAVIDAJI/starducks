<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<style>
    /* 상단의 페이지 제목 */
    .page-title {
        text-shadow: 0 1.5px 2px rgba(0, 0, 0, 0.25);
        color: #6B4D27;
    }
</style>

<th:block th:fragment="register">
    <h1 class="page-title" style="margin-bottom: 50px;">| Employee Registration</h1>
    <form id="form" th:action="@{/hr/emp/save}" method="post" th:object="${empDto}" onsubmit="return confirmAdd()" enctype="multipart/form-data" autocomplete="off">
        <div class="photos">
            <div class="photo">
                <img class="img" id="profileImg" src="#" alt="Profile Image">
                <input type="file" name="profile" id="profile" accept="image/*" style="display: none">
                <p>Profile</p>
            </div>
            <div class="photo">
                <img class="img" id="stampImg" src="#" alt="Stamp Image">
                <input type="file" name="stamp" id="stamp" accept="image/*" style="display: none">
                <p>Stamp</p>
            </div>
        </div>
        <div id="formSection">
            <section>
                <dl>
                    <dt>Employee ID</dt>
                    <dd>
                        <input type="text" th:value="${id}" disabled>
                    </dd>
                </dl>
<!--                <dl>-->
<!--                    <dt>초기비밀번호</dt>-->
<!--                    <dd><input type="hidden" th:field="*{pwd}" name="pwd" id="pwd"></dd>-->
<!--                </dl>-->
                <dl>
                    <dt>Employee Name</dt>
                    <dd>
                        <input type="text" th:field="*{empName}">
                        <div class="error" th:if="${#fields.hasErrors('empName')}" th:errors="*{empName}"></div>
                    </dd>

                </dl>
                <dl>
                    <dt>Phone</dt>
                    <dd>
                        <input type="text" th:field="*{empTel}">
                        <div class="error" th:each="err : ${#fields.errors('empTel')}" th:text="${err}"></div>
                    </dd>

                </dl>
                <dl>
                    <dt>Email</dt>
                    <dd>
                        <input type="text" th:field="*{email}">
                        <div class="error" th:each="err : ${#fields.errors('email')}" th:text="${err}"></div>
                    </dd>

                </dl>
                <dl>
                    <dt>Gender</dt>
                    <dd>
                        <label for="man">Male</label> <input type="radio" id="man" name="a" value="man" th:field="*{gender}">
                        <label for="woman">Female</label>  <input type="radio" id="woman" name="a" value="woman" th:field="*{gender}">
                        <div class="error" th:each="err : ${#fields.errors('gender')}" th:text="${err}"></div>
                    </dd>
                </dl>
                <dl>
                    <dt>Date of Birth</dt>
                    <dd>
                        <input type="date" th:field="*{birth}">
                    </dd>
                </dl>
            </section>
            <section>
                <dl>
                    <dt>Department</dt>
                    <dd>
                        <input type="checkbox" id="all1" class="selectbox box1">
                        <label for="all1" id="allLabel1">All<img th:src="@{/images/dropdown.png}" class="drop"></label>

                        <ul id="options1" style="display: none">
                            <li class="option1" th:each="dept : ${depts}" th:field="${dept}" th:value="${dept.deptId}">
                                <th:block th:text="${dept.deptName}"></th:block>
                            </li>
                        </ul>
                        <input id="dept" type="hidden" th:field="*{dept}">
                        <div class="error" th:each="err : ${#fields.errors('dept')}" th:text="${err}"></div>
                    </dd>
                </dl>

                <dl>
                    <dt>Position</dt>
                    <dd>
                        <input type="checkbox" id="all2" class="selectbox box2">
                        <label for="all2" id="allLabel2" >All<img th:src="@{/images/dropdown.png}" class="drop"></label>

                        <ul id="options2" style="display: none">
                            <li class="option2" th:each="position : ${positions}" th:field="${position}" th:value="${position}">
                                <th:block th:if="${position.toString() == 'ROLE_BOSS'}" th:text="CEO"></th:block>
                                <th:block th:if="${position.toString() == 'ROLE_DEPTLEADER'}" th:text="Department Head"></th:block>
                                <th:block th:if="${position.toString() == 'ROLE_TEAMLEADER'}" th:text="Team Leader"></th:block>
                                <th:block th:if="${position.toString() == 'ROLE_EMPLOYEE'}" th:text="Associate"></th:block>
                                <th:block th:if="${position.toString() == 'ROLE_STOREMANAGER'}" th:text="Store Manager"></th:block>
                            </li>
                        </ul>
                        <input id="position" type="hidden" th:field="*{position}">
                        <div class="error" th:each="err : ${#fields.errors('position')}" th:text="${err}"></div>
                    </dd>
                </dl>

                <dl>
                    <dt>Date of Joining</dt>
                    <dd>
                        <input type="date" th:field="*{joinDate}">
                        <div class="error" th:each="err : ${#fields.errors('joinDate')}" th:text="${err}"></div>
                    </dd>

                </dl>

                <dl>
                    <dt>Resignation Status</dt>
                    <dd>
                        <label for="stopped">Resigned</label> <input id="stopped" type="radio" name="a" value="true" th:field="*{status}">
                        <label for="running">Employed</label> <input id="running" type="radio" name="a" value="false" th:field="*{status}">
                        <div class="error" th:each="err : ${#fields.errors('status')}" th:text="${err}"></div>
                    </dd>
                </dl>

                <dl>
                    <dt>Date of Resignation</dt>
                    <dd><input type="date" disabled></dd>
                </dl>
                <dl>
                    <dt>Address</dt>
                    <dd>
                        <div th:replace="~{hr/emp/_postNo::searchPost}"></div>
                    </dd>
                </dl>
            </section>
        </div>
        <div class="btns">
            <button class="commonBtn register-button">Register</button>
            <a th:href="@{/hr/emp}"><p class="commonBtn cancel-button">Cancel</p></a>
        </div>
    </form>
</th:block>
</html>
