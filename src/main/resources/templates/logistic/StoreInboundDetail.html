<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">

<!--title-->

<th:block layout:fragment="addMore">
    <link rel="stylesheet" type="text/css" th:href="@{/css/logistic/style.css}">
    <script th:src="@{/js/logistic/store/script.js}"></script>
</th:block>

<style>
    /* 상단의 페이지 제목 */
    .page-title {
        text-shadow: 0 1.5px 2px rgba(0, 0, 0, 0.25);
        color: #6B4D27;
    }
</style>

<main layout:fragment="content">
    <h1 class="page-title" style="margin-bottom: 50px;">| Branch Inbound Details</h1>
    <div class="content">

        <div class="ipgodetail">
            Inbound Number<input type="text" th:value="${inbound.getStoreInboundId()}" readonly>
            <br>
            Branch<input type="text" th:value="${inbound.getStore().getStoreName()}" readonly>
            <br>
            Registered By<input type="text" th:value="${inbound.getStore().getEmployee().getEmpName()}" readonly>
            <br>
            Inbound Date<input type="text" th:value="${#temporals.format(inbound.getStoreInboundDate(), 'yyyy.MM.dd a hh:mm')}" readonly>
            <br>
        </div>

        <table class="detail-table">
            <thead>
            <tr>
                <th>Item Code</th><th>Item Name</th><th>Vendor</th><th>Unit Price</th><th>Quantity</th><th>Unit</th><th>Amount</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="i:${inbound.getInboundProducts()}">

                <td th:text="${i.getProduct().productCode}">Item code</td>
                <td th:text="${i.getProduct().productName}">Item Name</td>
                <td th:text="${i.getProduct().getVendor().getVendorName()}">거래처</td>
<!--                <td th:text="${i.getProduct().productPrice}">거래 단가</td>-->
                <td th:text="${#numbers.formatDecimal(i.getProduct().productPrice, 0, 'COMMA', 0, 'POINT') + ' 원'}">거래 단가</td>


                <td th:text="${#numbers.formatDecimal(i.getInboundQuantity(), 0, 'COMMA', 0, 'POINT')}">입고 수량</td>
<!--                <td th:text="${i.getInboundQuantity()}">입고 수량</td>-->
                <td th:text="${i.getProduct().productUnit}">단위</td>
                <td th:text="${#numbers.formatDecimal(i.getInboundPrice(), 0, 'COMMA', 0, 'POINT')}">입고 금액</td>
            </tr>
            </tbody>
            <tfoot>
            <tr>
                <td th:text="Total"></td>
                <td colspan="3"></td>
                <td th:text="${#numbers.formatDecimal(inbound.getTotalQuantity(), 0, 'COMMA', 0, 'POINT')}">Total Quantity</td>

                <td></td>
                <td th:text="${#numbers.formatDecimal(inbound.getTotalPrice(), 0, 'COMMA', 0, 'POINT') + ' 원'}">Total Price</td>
            </tr>
            </tfoot>
        </table>


    </div>
</main>


</html>
